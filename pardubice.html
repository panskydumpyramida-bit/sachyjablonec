<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soustředění Pardubice 2026 – Šachový oddíl TJ Bižuterie Jablonec</title>
    <meta name="description"
        content="Živé výsledky výpravy TJ Bižuterie Jablonec na Czech Open 2026 v Pardubicích — los dalšího kola, průběh dětí, rozcvička.">
    <meta property="og:title" content="Soustředění Pardubice 2026 – Bižuterie Jablonec">
    <meta property="og:description" content="Jak se daří naší výpravě na Czech Open v Pardubicích.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.sachyjablonec.cz/pardubice">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        /* ============ SPOLEČNÉ ============ */
        .pd-wrap {
            padding-bottom: 4rem;
        }

        .pd-in {
            max-width: 1120px;
            margin: 0 auto;
            padding: 0 16px;
        }

        .pd-sec {
            max-width: 1120px;
            margin: 0 auto;
            padding: 48px 16px 0;
        }

        .pd-eyebrow {
            font: 600 11px/1 'Inter', sans-serif;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--primary-color);
        }

        .pd-h2 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: clamp(25px, 4.4vw, 38px);
            line-height: 1.08;
            color: #f0ebdf;
            margin: 9px 0 0;
        }

        .pd-lead {
            font-size: 15px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-top: 10px;
            max-width: 620px;
            text-wrap: pretty;
        }

        .pd-card {
            background: var(--surface-color);
            border: 1px solid #2b2b31;
            border-radius: 8px;
            padding: 16px;
        }

        .pd-label {
            font: 600 10px 'Inter', sans-serif;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #8d8d95;
        }

        .pd-label.gold {
            color: var(--primary-color);
        }

        .pd-num {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            line-height: 1;
        }

        .pd-micro {
            font: 600 9px 'Inter', sans-serif;
            letter-spacing: 0.16em;
            color: #84848c;
        }

        .pd-note {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .pd-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 13px;
            border-radius: 6px;
            background: #16161b;
            border: 1px solid #2d2d35;
            font: 500 12px 'Inter', sans-serif;
            letter-spacing: 0.06em;
            color: var(--text-muted);
        }

        .pd-pill.gold {
            background: rgba(212, 175, 55, 0.13);
            border-color: rgba(212, 175, 55, 0.4);
            color: #e8ce74;
            font-weight: 600;
            letter-spacing: 0.13em;
            text-transform: uppercase;
        }

        .pd-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--primary-color);
            flex: 0 0 auto;
        }

        .pd-dot.live {
            animation: pdLive 1.6s ease-in-out infinite;
        }

        @keyframes pdLive {

            0%,
            100% {
                opacity: 1;
                transform: scale(1);
            }

            50% {
                opacity: 0.35;
                transform: scale(0.82);
            }
        }

        @keyframes pdShimmer {
            from {
                background-position: -320px 0;
            }

            to {
                background-position: 320px 0;
            }
        }

        /* odkaz na chess-results */
        .pd-cr {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 8px 12px;
            border-radius: 6px;
            background: #16161b;
            border: 1px solid #2f2f37;
            color: var(--text-muted);
            font: 600 12px 'Inter', sans-serif;
            text-decoration: none;
            transition: border-color 0.18s cubic-bezier(.2, .7, .3, 1), color 0.18s cubic-bezier(.2, .7, .3, 1);
            white-space: nowrap;
        }

        .pd-cr:hover {
            border-color: rgba(212, 175, 55, 0.5);
            color: #e6c565;
        }

        .pd-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            min-height: 46px;
            padding: 13px 20px;
            border-radius: 6px;
            background: var(--primary-color);
            border: 1px solid var(--primary-color);
            color: #161206;
            font: 600 15px 'Inter', sans-serif;
            text-decoration: none;
            cursor: pointer;
        }

        .pd-btn.ghost {
            background: transparent;
            border-color: #2f2f37;
            color: var(--text-muted);
        }

        .pd-btn.ghost:hover {
            border-color: #3f3f4a;
            color: var(--text-color);
        }

        /* ============ HERO ============ */
        .pd-hero {
            position: relative;
            overflow: hidden;
            background: radial-gradient(130% 105% at 50% -10%, #1c1710 0%, #0b0b0e 60%);
            border-bottom: 1px solid #22222a;
        }

        .pd-hero::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0.07;
            background-image:
                linear-gradient(45deg, #d4af37 25%, transparent 25%, transparent 75%, #d4af37 75%),
                linear-gradient(45deg, #d4af37 25%, transparent 25%, transparent 75%, #d4af37 75%);
            background-size: 64px 64px;
            background-position: 0 0, 32px 32px;
            -webkit-mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 72%);
            mask-image: linear-gradient(to bottom, rgba(0, 0, 0, 0.9), transparent 72%);
            pointer-events: none;
        }

        .pd-heroin {
            position: relative;
            max-width: 1120px;
            margin: 0 auto;
            /* pod fixním headerem */
            padding: 110px 16px 34px;
        }

        .pd-title {
            font-family: 'Playfair Display', serif;
            font-weight: 800;
            font-size: clamp(38px, 9.5vw, 82px);
            line-height: 0.92;
            letter-spacing: -0.025em;
            color: #f3eee2;
            margin: 16px 0 0;
        }

        .pd-title span {
            color: var(--primary-color);
        }

        .pd-hsub {
            margin-top: 14px;
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-muted);
            max-width: 560px;
            text-wrap: pretty;
        }

        .pd-hstats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            gap: 14px;
            margin-top: 26px;
            align-items: stretch;
        }

        .pd-duo {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .pd-stat {
            background: var(--surface-color);
            border: 1px solid #2b2b31;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .pd-stat .pd-num {
            font-size: 40px;
            color: #f0e6cc;
            margin-top: 10px;
        }

        .pd-stat .pd-num.gold {
            color: var(--primary-color);
        }

        .pd-stat .pd-num.small {
            font-size: 24px;
            line-height: 1.15;
        }

        /* odpočet */
        .pd-clock {
            display: flex;
            gap: 8px;
            margin-top: 12px;
        }

        .pd-tick {
            flex: 1;
            background: #141418;
            border: 1px solid #2f2f37;
            border-radius: 6px;
            padding: 9px 4px;
            text-align: center;
        }

        .pd-tick b {
            display: block;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 28px;
            line-height: 1;
            color: #f0e6cc;
        }

        .pd-tick.gold b {
            color: var(--primary-color);
        }

        .pd-tick span {
            display: block;
            font: 600 9px 'Inter', sans-serif;
            letter-spacing: 0.16em;
            color: #84848c;
            margin-top: 5px;
        }

        /* ============ LOS ============ */
        .pd-empty {
            margin-top: 20px;
            border: 1px dashed rgba(212, 175, 55, 0.45);
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(212, 175, 55, 0.05), #161619);
            padding: 30px 20px;
            text-align: center;
        }

        .pd-empty h3 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 24px;
            color: #f0ebdf;
            margin: 0;
        }

        .pd-empty p {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
            margin: 10px auto 0;
            max-width: 460px;
            text-wrap: pretty;
        }

        .pd-skel {
            display: grid;
            gap: 8px;
            margin: 26px auto 0;
            max-width: 520px;
        }

        .pd-skel i {
            display: block;
            height: 44px;
            border-radius: 6px;
            background: linear-gradient(90deg, #1a1a1f 25%, #232329 50%, #1a1a1f 75%);
            background-size: 320px 100%;
            animation: pdShimmer 1.5s linear infinite;
        }

        .pd-skel i:nth-child(2) {
            opacity: 0.7;
        }

        .pd-skel i:nth-child(3) {
            opacity: 0.45;
        }

        /* auto-fill, ne auto-fit — jediná karta se pak neroztáhne přes celou šířku */
        .pd-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 12px;
            margin-top: 14px;
        }

        .pd-board {
            background: var(--surface-color);
            border: 1px solid #2b2b31;
            border-radius: 8px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .pd-bhead {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pd-chip {
            padding: 4px 8px;
            border-radius: 6px;
            background: #141418;
            border: 1px solid #33333a;
            font: 600 10px 'Inter', sans-serif;
            letter-spacing: 0.14em;
            color: #a5a5ad;
        }

        .pd-color {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font: 600 12px 'Inter', sans-serif;
            color: var(--text-color);
        }

        .pd-disc {
            width: 13px;
            height: 13px;
            border-radius: 50%;
            background: #f2ece0;
            flex: 0 0 auto;
        }

        .pd-disc.b {
            background: #0b0b0e;
            border: 1px solid #6a6a72;
        }

        .pd-disc.sm {
            width: 10px;
            height: 10px;
        }

        .pd-bme {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 18px;
            color: #f0ece2;
            line-height: 1.2;
        }

        .pd-bme small {
            font: 400 12px 'Inter', sans-serif;
            color: var(--text-muted);
        }

        .pd-bvs {
            display: flex;
            align-items: center;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid #27272d;
            flex-wrap: wrap;
        }

        .pd-vslab {
            font: 600 10px 'Inter', sans-serif;
            letter-spacing: 0.16em;
            color: #7f7f88;
        }

        .pd-opp {
            font-size: 15px;
            color: var(--text-color);
        }

        .pd-prep {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-size: 15px;
            color: var(--text-color);
            text-decoration: none;
            border-bottom: 1px solid rgba(212, 175, 55, 0.45);
            transition: color 0.18s cubic-bezier(.2, .7, .3, 1), border-color 0.18s cubic-bezier(.2, .7, .3, 1);
        }

        .pd-prep i {
            color: var(--primary-color);
            font-size: 0.72em;
        }

        .pd-prep:hover {
            color: #e6c565;
            border-color: var(--primary-color);
        }

        /* soupeř z dohrané partie — odkaz do databáze, ale bez důrazu „příprava" */
        .pd-oppl {
            font-size: 15px;
            color: var(--text-color);
            text-decoration: none;
            border-bottom: 1px dotted #45454e;
            transition: color 0.18s cubic-bezier(.2, .7, .3, 1), border-color 0.18s cubic-bezier(.2, .7, .3, 1);
        }

        .pd-oppl:hover {
            color: #e6c565;
            border-bottom-color: var(--primary-color);
        }

        .pd-orat {
            font: 600 13px 'Inter', sans-serif;
            color: var(--primary-color);
        }

        /* výsledek partie */
        .pd-r {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font: 600 11px 'Inter', sans-serif;
            padding: 4px 9px;
            border: 1px solid transparent;
        }

        .pd-r.w {
            background: rgba(212, 175, 55, 0.14);
            border-color: rgba(212, 175, 55, 0.42);
            color: #e6c565;
        }

        .pd-r.d {
            background: rgba(122, 166, 190, 0.13);
            border-color: rgba(122, 166, 190, 0.36);
            color: #9dc3d6;
        }

        .pd-r.l {
            background: rgba(200, 110, 110, 0.12);
            border-color: rgba(200, 110, 110, 0.32);
            color: #d69a9a;
        }

        .pd-r.n {
            background: transparent;
            border: 1px dashed rgba(212, 175, 55, 0.45);
            color: #a48a3c;
        }

        /* ============ HRÁČI ============ */
        .pd-thead {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-top: 22px;
        }

        .pd-tname {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
        }

        .pd-tname b {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 20px;
            color: #f0ebdf;
        }

        .pd-tname span {
            font-size: 12.5px;
            color: #75757e;
        }

        .pd-players {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(285px, 1fr));
            gap: 14px;
            margin-top: 12px;
        }

        .pd-p {
            background: var(--surface-color);
            border: 1px solid #2b2b31;
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 13px;
        }

        .pd-ptop {
            display: flex;
            align-items: flex-start;
            gap: 12px;
        }

        .pd-av {
            flex: 0 0 44px;
            width: 44px;
            height: 44px;
            border-radius: 8px;
            background: #26221a;
            border: 1px solid #3d3426;
            display: flex;
            align-items: center;
            justify-content: center;
            font: 700 15px 'Inter', sans-serif;
            color: var(--primary-color);
        }

        .pd-pname {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 19px;
            line-height: 1.2;
            color: #f0ece2;
        }

        .pd-pmeta {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .pd-ppts {
            text-align: right;
            flex: 0 0 auto;
        }

        .pd-ppts b {
            display: block;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 27px;
            line-height: 1;
            color: var(--primary-color);
        }

        .pd-rounds {
            display: flex;
            gap: 6px;
        }

        .pd-rounds .pd-r {
            flex: 1;
            height: 30px;
            padding: 0;
        }

        .pd-glist {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding-top: 12px;
            border-top: 1px solid #26262c;
        }

        .pd-ghead {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            font: 600 9px 'Inter', sans-serif;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: #75757e;
        }

        .pd-g {
            display: flex;
            align-items: center;
            gap: 8px;
            min-width: 0;
            min-height: 30px;
        }

        .pd-g>.rd {
            flex: 0 0 22px;
            font: 600 10px 'Inter', sans-serif;
            color: #75757e;
        }

        .pd-g>.op {
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 13px;
            color: var(--text-color);
        }

        .pd-g .pd-prep,
        .pd-g .pd-oppl,
        .pd-g .pd-opp {
            font-size: 13px;
        }

        .pd-g>.rt {
            flex: 0 0 auto;
            font: 500 11px 'Inter', sans-serif;
            color: #8d8d95;
        }

        .pd-g>.pd-r {
            flex: 0 0 auto;
            width: 22px;
            padding: 3px 0;
            font-size: 10px;
        }

        /* ============ GRAFIKY ============ */
        .pd-bars {
            display: flex;
            align-items: flex-end;
            gap: 12px;
            height: 132px;
            margin-top: 18px;
        }

        .pd-bars>div {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            height: 100%;
            gap: 8px;
        }

        .pd-bars b {
            text-align: center;
            font: 700 13px 'Inter', sans-serif;
            color: #e6c565;
        }

        .pd-bars i {
            display: block;
            border-radius: 6px 6px 0 0;
            background: linear-gradient(180deg, #e0bc4a, #8d7326);
        }

        .pd-bars .next b {
            color: #a48a3c;
        }

        .pd-bars .next i {
            border: 1px dashed rgba(212, 175, 55, 0.5);
            background: rgba(212, 175, 55, 0.06);
        }

        .pd-xaxis {
            display: flex;
            gap: 12px;
            margin-top: 9px;
        }

        .pd-xaxis span {
            flex: 1;
            text-align: center;
            font: 600 10px 'Inter', sans-serif;
            letter-spacing: 0.12em;
            color: #84848c;
        }

        .pd-xaxis span.on {
            color: var(--primary-color);
        }

        .pd-scalp {
            position: relative;
            overflow: hidden;
            background: linear-gradient(160deg, #2a2213, #1b1a17 55%);
            border: 1px solid rgba(212, 175, 55, 0.42);
            border-radius: 8px;
            padding: 18px;
        }

        .pd-scalp h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 24px;
            line-height: 1.15;
            color: #f6f0e0;
            margin: 12px 0 0;
        }

        .pd-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 14px;
        }

        .pd-tag {
            padding: 6px 10px;
            border-radius: 6px;
            background: #16161b;
            border: 1px solid #33333a;
            font: 500 12px 'Inter', sans-serif;
            color: var(--text-muted);
        }

        .pd-tag.gold {
            background: rgba(212, 175, 55, 0.14);
            border-color: rgba(212, 175, 55, 0.36);
            color: #e6c565;
            font-weight: 600;
        }

        .pd-hr {
            height: 1px;
            background: rgba(212, 175, 55, 0.22);
            margin: 16px 0;
        }

        .pd-miles {
            display: flex;
            flex-direction: column;
            gap: 9px;
        }

        .pd-miles div {
            display: flex;
            align-items: baseline;
            gap: 8px;
            font-size: 13.5px;
            color: var(--text-color);
        }

        .pd-miles em {
            color: #7fc9b8;
            flex: 0 0 auto;
            font-style: normal;
        }

        .pd-rank {
            display: flex;
            flex-direction: column;
            gap: 7px;
            margin-top: 16px;
        }

        .pd-rank>div {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .pd-rank .nm {
            flex: 0 0 112px;
            font-size: 12px;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .pd-rank .tr {
            flex: 1;
            height: 14px;
            border-radius: 6px;
            background: #17171b;
            overflow: hidden;
        }

        .pd-rank .tr i {
            display: block;
            height: 100%;
            border-radius: 6px;
            background: linear-gradient(90deg, #8d7326, #e0bc4a);
        }

        .pd-rank .vl {
            flex: 0 0 40px;
            text-align: right;
            font: 600 12px 'Inter', sans-serif;
            color: #e6c565;
        }

        /* ============ ROZCVIČKA ============ */
        .pd-hl {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .pd-hl>div {
            background: var(--surface-color);
            border: 1px solid #2b2b31;
            border-radius: 8px;
            padding: 15px;
        }

        .pd-hl>div.gold {
            border-color: rgba(212, 175, 55, 0.34);
        }

        .pd-hl h4 {
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 21px;
            line-height: 1.15;
            color: #f4efe2;
            margin: 9px 0 0;
        }

        .pd-hl p {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 7px 0 0;
        }

        .pd-lb {
            background: var(--surface-color);
            border: 1px solid #2b2b31;
            border-radius: 8px;
            padding: 18px;
            margin-top: 14px;
        }

        .pd-lbhead {
            display: flex;
            flex-wrap: wrap;
            align-items: baseline;
            justify-content: space-between;
            gap: 10px;
            padding-bottom: 6px;
        }

        .pd-row {
            padding: 12px 0;
            border-top: 1px solid #26262c;
        }

        .pd-rowin {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .pd-pos {
            flex: 0 0 26px;
            text-align: center;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 17px;
            line-height: 1;
            color: var(--primary-color);
        }

        .pd-av.sm {
            flex: 0 0 34px;
            width: 34px;
            height: 34px;
            font-size: 12px;
        }

        .pd-who {
            flex: 1;
            min-width: 0;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font: 600 15px 'Inter', sans-serif;
            color: #f0ece2;
        }

        .pd-score b {
            display: block;
            font-family: 'Playfair Display', serif;
            font-weight: 700;
            font-size: 19px;
            line-height: 1;
            color: #e6c565;
            text-align: right;
        }

        .pd-prog {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-top: 8px;
            padding-left: 71px;
            flex-wrap: wrap;
        }

        .pd-prog .tr {
            flex: 1 1 60px;
            min-width: 40px;
            max-width: 420px;
            height: 5px;
            border-radius: 3px;
            background: #17171b;
            overflow: hidden;
        }

        .pd-prog .tr i {
            display: block;
            height: 100%;
            border-radius: 3px;
            background: linear-gradient(90deg, #8d7326, #e0bc4a);
        }

        .pd-prog span {
            font: 500 11px 'Inter', sans-serif;
            color: #8d8d95;
            flex: 0 0 auto;
        }

        /* ============ NOTIFIKACE ============ */
        .pd-sub {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 14px;
            background: #17171b;
            border: 1px solid #2b2b31;
            border-radius: 8px;
            padding: 16px;
        }

        .pd-sub>div {
            flex: 1 1 230px;
            min-width: 0;
        }

        .pd-sub strong {
            display: block;
            font: 600 15px 'Inter', sans-serif;
            color: #f0ece2;
        }

        .pd-sub small {
            display: block;
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .pd-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: space-between;
            align-items: center;
            margin-top: 18px;
            font-size: 12.5px;
            color: #75757e;
        }

        @media (max-width: 560px) {
            .pd-duo {
                grid-template-columns: 1fr 1fr;
            }

            .pd-sec {
                padding-top: 40px;
            }

            .pd-prog {
                padding-left: 0;
            }

            .pd-rank .nm {
                flex: 0 0 72px;
            }
        }
    </style>
</head>

                    <i class="fa-solid fa-spinner fa-spin" style="font-size:1.6rem; color:var(--primary-color);"></i>
                    <p style="margin-top:0.8rem; color:var(--text-muted);">Načítám výsledky z Pardubic…</p>
                </div>
            </div>

    <footer id="global-footer"></footer>

    <script src="js/config.js"></script>
    <script src="js/layout-loader.js" defer></script>
