<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soustředění Pardubice 2026 – Šachový oddíl TJ Bižuterie Jablonec</title>
    <meta name="description"
        content="Živé výsledky výpravy TJ Bižuterie Jablonec na Czech Open 2026 v Pardubicích — los dalšího kola, průběh dětí, rozcvička.">
    <meta property="og:title" content="Soustředění Pardubice 2026 – Bižuterie Jablonec">
    <meta property="og:description" content="Jak se daří naší výpravě na Czech Open v Pardubicích.">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://www.sachyjablonec.cz/pardubice">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;700;900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" type="image/png" href="images/favicon.png">
    <style>
        .pd-wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 100px 1rem 4rem;
        }

        /* ---------- HERO ---------- */
        .pd-hero {
            position: relative;
            overflow: hidden;
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 10px;
            background:
                radial-gradient(1200px 400px at 15% -10%, rgba(212, 175, 55, 0.18), transparent 60%),
                linear-gradient(160deg, #16161d, #0d0d12);
            padding: 1.6rem 1.4rem;
            margin-bottom: 1.25rem;
        }

        .pd-kicker {
            font-size: 0.75rem;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--primary-color);
            font-weight: 700;
        }

        .pd-title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(1.8rem, 6vw, 3rem);
            line-height: 1.05;
            color: #fff;
            margin: 0.3rem 0 0.5rem;
        }

        .pd-sub {
            color: var(--text-muted);
            font-size: 0.95rem;
        }

        .pd-roundline {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1.1rem;
        }

        .pd-roundnum {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.4rem, 9vw, 4rem);
            font-weight: 900;
            color: var(--primary-color);
            line-height: 1;
        }

        .pd-segs {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .pd-seg {
            width: 26px;
            height: 7px;
            border-radius: 2px;
            background: rgba(255, 255, 255, 0.12);
        }

        .pd-seg.done {
            background: var(--primary-color);
        }

        .pd-seg.now {
            background: #fff;
            animation: pdPulse 1.6s ease-in-out infinite;
        }

        @keyframes pdPulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.35;
            }
        }

        .pd-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            font-weight: 700;
            padding: 0.3rem 0.7rem;
            border-radius: 6px;
        }

        .pd-badge.live {
            background: rgba(52, 211, 153, 0.15);
            color: #34d399;
            border: 1px solid rgba(52, 211, 153, 0.35);
        }

        .pd-badge.wait {
            background: rgba(251, 191, 36, 0.12);
            color: #fbbf24;
            border: 1px solid rgba(251, 191, 36, 0.3);
        }

        /* ---------- KPI ---------- */
        .pd-kpis {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 0.7rem;
            margin-top: 1.2rem;
        }

        .pd-kpi {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 0.75rem 0.9rem;
        }

        .pd-kpi b {
            display: block;
            font-family: 'Playfair Display', serif;
            font-size: 1.7rem;
            color: #fff;
            line-height: 1.1;
        }

        .pd-kpi span {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        /* ---------- SEKCE ---------- */
        .pd-section {
            margin-top: 2rem;
        }

        .pd-h2 {
            font-family: 'Playfair Display', serif;
            font-size: 1.5rem;
            color: var(--primary-color);
            margin-bottom: 0.9rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .pd-card {
            background: var(--surface-color, #1e1e1e);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 1rem 1.1rem;
        }

        /* ---------- LOS ---------- */
        .pd-board {
            display: flex;
            align-items: center;
            gap: 0.9rem;
            padding: 0.8rem 0.9rem;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-left: 4px solid var(--primary-color);
            margin-bottom: 0.6rem;
            flex-wrap: wrap;
        }

        .pd-boardno {
            font-family: 'Playfair Display', serif;
            font-size: 1.9rem;
            font-weight: 700;
            color: var(--primary-color);
            min-width: 3rem;
            text-align: center;
            line-height: 1;
        }

        .pd-boardno small {
            display: block;
            font-family: 'Inter', sans-serif;
            font-size: 0.55rem;
            color: var(--text-muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .pd-vs {
            flex: 1;
            min-width: 200px;
        }

        .pd-me {
            font-weight: 700;
            color: #fff;
            font-size: 1.02rem;
        }

        .pd-opp {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-top: 0.15rem;
        }

        .pd-chip {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            font-size: 0.7rem;
            padding: 0.12rem 0.45rem;
            border-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            vertical-align: middle;
        }

        .pd-chip.w {
            background: #f1f1f1;
            color: #111;
        }

        .pd-chip.b {
            background: #16161d;
            color: #eee;
        }

        .pd-prep {
            font-size: 0.78rem;
            color: #93c5fd;
            text-decoration: none;
            white-space: nowrap;
        }

        .pd-prep:hover {
            text-decoration: underline;
        }

        .pd-res {
            font-family: 'Playfair Display', serif;
            font-size: 1.3rem;
            font-weight: 700;
            min-width: 4.5rem;
            text-align: right;
        }

        .pd-res.win {
            color: #34d399;
        }

        .pd-res.loss {
            color: #f87171;
        }

        .pd-res.draw {
            color: #fbbf24;
        }

        .pd-res.pending {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
        }

        /* ---------- HRÁČI ---------- */
        .pd-players {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 0.7rem;
        }

        .pd-player {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.07);
            border-radius: 8px;
            padding: 0.85rem 0.95rem;
        }

        .pd-pname {
            font-weight: 700;
            color: #fff;
            font-size: 1rem;
        }

        .pd-pmeta {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        .pd-prow {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            margin: 0.55rem 0 0.4rem;
        }

        .pd-pts {
            font-family: 'Playfair Display', serif;
            font-size: 1.6rem;
            font-weight: 700;
            color: var(--primary-color);
            line-height: 1;
        }

        .pd-rank {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .pd-games {
            display: flex;
            gap: 4px;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .pd-g {
            width: 22px;
            height: 22px;
            border-radius: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.66rem;
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .pd-g.w {
            background: rgba(52, 211, 153, 0.22);
            color: #34d399;
        }

        .pd-g.l {
            background: rgba(248, 113, 113, 0.16);
            color: #f87171;
        }

        .pd-g.d {
            background: rgba(251, 191, 36, 0.16);
            color: #fbbf24;
        }

        .pd-g.n {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-muted);
        }

        .pd-tag {
            display: inline-block;
            font-size: 0.68rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
            padding: 0.1rem 0.4rem;
            margin-top: 0.5rem;
        }

        /* ---------- ROZCVIČKA ---------- */
        .pd-warm {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.45rem 0.2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .pd-warm:last-child {
            border-bottom: none;
        }

        .pd-wpos {
            font-family: 'Playfair Display', serif;
            font-size: 1rem;
            color: var(--primary-color);
            min-width: 1.6rem;
        }

        .pd-wname {
            flex: 1;
            color: #e8e8e8;
            font-size: 0.92rem;
        }

        .pd-wscore {
            font-weight: 700;
            color: #fff;
        }

        .pd-wmeta {
            font-size: 0.72rem;
            color: var(--text-muted);
            min-width: 5.5rem;
            text-align: right;
        }

        /* ---------- SDÍLENÍ ---------- */
        .pd-share {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            flex-wrap: wrap;
            background: rgba(37, 211, 102, 0.07);
            border: 1px solid rgba(37, 211, 102, 0.25);
            border-radius: 8px;
            padding: 0.8rem 1rem;
            margin-top: 1rem;
        }

        .pd-wa {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background: #25d366;
            color: #06301a;
            font-weight: 700;
            padding: 0.6rem 1.1rem;
            border-radius: 6px;
            text-decoration: none;
            font-size: 0.92rem;
        }

        @media (max-width: 560px) {
            .pd-wrap {
                padding-top: 90px;
            }

            .pd-boardno {
                font-size: 1.5rem;
                min-width: 2.4rem;
            }

            .pd-res {
                min-width: 3.4rem;
                font-size: 1.1rem;
            }

            .pd-players {
                grid-template-columns: 1fr;
            }

            .pd-wmeta {
                display: none;
            }
        }
    </style>
</head>

<body>
    <header id="global-header"></header>

    <main>
        <div class="pd-wrap">
            <p style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.75rem;">
                <a href="/youth" style="color:#93c5fd;">Mládež</a>
                <span style="opacity:0.5;"> / </span> Soustředění Pardubice
            </p>

            <div id="pdRoot">
                <div class="pd-card" style="text-align:center; padding:3rem 1rem;">
                    <i class="fa-solid fa-spinner fa-spin" style="font-size:1.6rem; color:var(--primary-color);"></i>
                    <p style="margin-top:0.8rem; color:var(--text-muted);">Načítám výsledky z Pardubic…</p>
                </div>
            </div>
        </div>
    </main>

    <footer id="global-footer"></footer>

    <script src="js/config.js"></script>
    <script src="js/layout-loader.js" defer></script>
    <script src="js/main.js" defer></script>
    <script src="js/pardubice.js"></script>
</body>

</html>
